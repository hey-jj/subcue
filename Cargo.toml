[package]
name = "subcue"
version = "0.1.0"
edition = "2021"
rust-version = "1.70.0"
authors = ["Justin Jones <hey.jones@icloud.com>"]
license = "MIT"
description = "Parse, compose, and convert SRT, WebVTT, and ASS/SSA subtitle files"
keywords = ["subtitle", "srt", "webvtt", "ass", "ssa"]
categories = ["parser-implementations", "multimedia::video"]
readme = "README.md"
repository = "https://github.com/hey-jj/subcue"
documentation = "https://docs.rs/subcue"
exclude = ["tools/**", "fuzz/**"]

[dev-dependencies]
proptest = "1.5"
serde_json = "1.0"

